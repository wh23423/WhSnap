name: release

# 触发方式：
#   1) 推送 v* 标签  → 构建 + 打包 + 发布 GitHub Release
#   2) 手动 workflow_dispatch → 只构建并上传 artifact，不创建 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
  SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '0.1.0'
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building WhSnap $version"

      - name: Restore
        run: dotnet restore WhSnap.sln

      - name: Unit tests
        run: dotnet test tests/WhSnap.Core.Tests/WhSnap.Core.Tests.csproj -c Release --no-restore

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (publish + ISCC + update.json)
        shell: pwsh
        run: |
          # Tag builds point the manifest at that tag's release asset URL; manual runs
          # keep the local path (the manifest is still useful for offline checks).
          # Hashtable splatting: explicit named binding, identical on Windows
          # PowerShell 5.1 and pwsh 7. Array splatting of string literals is NOT
          # reliable here -- on pwsh 7 the '-Name' entries collapsed into the first
          # positional parameter, so -Version got bound to -Configuration and the
          # version string reached dotnet publish as a RuntimeIdentifier (NETSDK1083).
          $buildArgs = @{ Version = '${{ steps.version.outputs.version }}' }
          if ('${{ github.ref_type }}' -eq 'tag') {
            $base = '${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}'
            $buildArgs.ReleaseBaseUrl = $base
          }

          # Signing is opt-in via secrets. build-installer.ps1 signs the payload BEFORE
          # ISCC (so the installed WhSnap.exe is signed too), signs the setup exe after,
          # exports the public .cer for install-trust.ps1, and only then writes update.json
          # so the manifest hashes the SIGNED installer.
          if ($env:SIGNING_PFX_BASE64) {
            Write-Host 'Signing enabled (SIGNING_PFX_BASE64 is set).'
            $buildArgs.Sign = $true
            $buildArgs.PfxBase64 = $env:SIGNING_PFX_BASE64
            $buildArgs.PfxPassword = $env:SIGNING_PFX_PASSWORD
          }
          else {
            Write-Host 'Signing secrets are not configured; building an unsigned preview.'
          }

          ./build/tools/build-installer.ps1 @buildArgs

      - name: Smoke test (non-blocking, needs a desktop session)
        continue-on-error: true
        shell: pwsh
        run: |
          # WinExe: must use Start-Process -Wait, otherwise PowerShell does not wait and
          # the report file below would still be the previous run's.
          foreach ($check in '--selftest', '--power-test') {
            $p = Start-Process -FilePath artifacts/publish/WhSnap.exe -ArgumentList $check -Wait -PassThru
            Write-Host "$check exit code: $($p.ExitCode)"
            $report = Join-Path $env:TEMP ("whsnap{0}.txt" -f $check.Replace('--', '-'))
            if (Test-Path $report) { Get-Content $report -Encoding UTF8 }
          }

      - name: Verify update.json
        shell: pwsh
        run: |
          $p = Start-Process -FilePath artifacts/publish/WhSnap.exe `
            -ArgumentList '--update-test','--manifest','artifacts/installer/update.json' -Wait -PassThru
          Write-Host "update-test exit code: $($p.ExitCode)"
          $report = Join-Path $env:TEMP 'whsnap-update-test.txt'
          if (Test-Path $report) { Get-Content $report -Encoding UTF8 | Select-Object -Last 12 }
          if ($p.ExitCode -ne 0) { throw "update.json verification failed (exit $($p.ExitCode))." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhSnap-${{ steps.version.outputs.version }}-setup-x64
          path: |
            artifacts/installer/*.exe
            artifacts/installer/update.json
            build/installer/install-trust.ps1
            artifacts/signing/*.cer
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installer/*.exe
            artifacts/installer/update.json
            build/installer/install-trust.ps1
            artifacts/signing/*.cer
          generate_release_notes: true
          body: |
            WhSnap ${{ steps.version.outputs.version }}（预览版）

            ## 安装
            1. 下载 `WhSnap-${{ steps.version.outputs.version }}-setup-x64.exe`
            2. 运行安装，按提示完成（默认会勾选开机自启）
            3. 按 `F1` 开始截图

            ## 自动更新
            本 Release 同时上传了 `update.json`（版本 / 通道 / 下载地址 / SHA-256 / 体积）。
            程序启动后会自动读它；`WhSnap.exe --update-test` 可离线验证这条链路。

            ## 关于「未知发布者」提示
            本版本使用自签名证书（发布页同时提供 `WhSnap.cer`）。若出现发布者未知的提示，可运行随附的
            `install-trust.ps1`（需管理员）一次性导入信任，之后不再提示。
            详细说明见仓库 README 的「分发」一节。

            ## 已知限制（预览版）
            - 真实双屏（尤其混合缩放比）的鼠标捕获跨屏移交尚未在双屏机上回归，目前只有合成拓扑自检
            - HDR / 宽色域：WGC 与 DXGI 只处理 BGRA8，遇到 10-bit 或浮点格式会自动降级到 GDI
            - 卸载程序 `unins000.exe` 由安装器现场生成、没有签名，卸载时可能仍显示「未知发布者」
            - 低级键盘钩子降级路径（`WH_KEYBOARD_LL`）尚未提供：某个键被系统占用时只能改键
